strictPeerDependencies: true
# Vite+ manages Node and the package-manager version.
runtimeOnFail: ignore
pmOnFail: ignore
overrides:
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.4.0"
  "vitest@*": "5.0.5"
# The Vite-compatible core uses Vite+'s version number.
peerDependencyRules:
  allowedVersions:
    vite: "1.4.0"
